name: Сборка установщика

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Загрузка Electron с поддержкой Widevine
        run: node scripts/get-electron.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка установщика
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Сохранение установщика
        uses: actions/upload-artifact@v4
        with:
          name: Island-Player-Setup
          path: dist/Island-Player-Setup.exe

      - name: Прикрепление к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Island-Player-Setup.exe
